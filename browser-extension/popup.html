<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TripBuddy Import</title>
    <style>
      body {
        color: #172033;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        width: 340px;
      }

      main {
        display: grid;
        gap: 12px;
        padding: 16px;
      }

      h1 {
        font-size: 18px;
        margin: 0;
      }

      label {
        display: grid;
        font-size: 12px;
        font-weight: 700;
        gap: 6px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      input {
        border: 1px solid #c8d2e3;
        border-radius: 10px;
        font: inherit;
        padding: 10px;
      }

      button {
        background: #1f5eff;
        border: 0;
        border-radius: 999px;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        padding: 10px 14px;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .muted {
        color: #667085;
        font-size: 12px;
        line-height: 1.4;
      }

      .status {
        background: #f3f6fb;
        border-radius: 12px;
        font-size: 12px;
        line-height: 1.4;
        min-height: 18px;
        padding: 10px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>TripBuddy Import</h1>
        <p class="muted">Open a hotel rate page, enter the TripBuddy booking ID, then import visible rate evidence.</p>
      </div>
      <label>
        Booking ID
        <input id="bookingId" autocomplete="off" placeholder="Paste booking ID" />
      </label>
      <label>
        Local TripBuddy URL
        <input id="endpoint" autocomplete="off" value="http://localhost:3000" />
      </label>
      <button id="importButton" type="button">Import current page</button>
      <div id="status" class="status">Ready.</div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
