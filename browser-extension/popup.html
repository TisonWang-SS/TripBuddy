<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TripBuddy Import</title>
    <style>
      body {
        color: #172033;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        width: 340px;
      }

      main {
        display: grid;
        gap: 12px;
        padding: 16px;
      }

      h1 {
        font-size: 18px;
        margin: 0;
      }

      button {
        background: #1f5eff;
        border: 0;
        border-radius: 999px;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        padding: 10px 14px;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .muted {
        color: #667085;
        font-size: 12px;
        line-height: 1.4;
      }

      .status {
        background: #f3f6fb;
        border-radius: 12px;
        font-size: 12px;
        line-height: 1.4;
        min-height: 18px;
        padding: 10px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>TripBuddy Companion</h1>
        <p class="muted">Open a Hyatt task from the local TripBuddy app. This popup can retry the task associated with the current tab.</p>
      </div>
      <button id="importButton" type="button">Retry current TripBuddy task</button>
      <div id="status" class="status">Waiting for a TripBuddy task.</div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
